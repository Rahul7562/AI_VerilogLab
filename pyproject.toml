[project]
name = "ai-veriloglab"
version = "0.1.0"
description = "AI VerilogLab - CLI driven RTL generation, simulation, synthesis and PPA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
  "python-dotenv>=1.0",
  "openai>=1.0",
  "httpx>=0.27",
]

[project.scripts]
vlab = "vlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
